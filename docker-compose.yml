services:
  # База данных PostgreSQL
  db:
    image: postgres:15
    container_name: task_tracker_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-task_tracker_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django приложение
  web:
    build: .
    container_name: task_tracker_web
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 config.wsgi:application"
    volumes:
      - .:/app
    expose:
      - "8000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-django-insecure-change-me}
      - DEBUG=${DEBUG:-True}
      - NAME=${POSTGRES_DB:-task_tracker_db}
      - USER=${POSTGRES_USER:-postgres}
      - PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - HOST=db
      - PORT=5432
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,web}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
    depends_on:
      db:
        condition: service_healthy

  # Nginx обратный прокси
  nginx:
    image: nginx:alpine
    container_name: task_tracker_nginx
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./staticfiles:/app/staticfiles:ro
    ports:
      - "80:80"
    depends_on:
      - web

volumes:
  postgres_data: